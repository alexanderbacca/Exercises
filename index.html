<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse & Power Tracker</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-color: #000;
            color: #fff;
            margin: 0;
            padding: 0;
        }
        .text-gradient {
            background: linear-gradient(to right, #f97316, #dc2626);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
(function () {
    var IMAGE_BASE = 'https://raw.githubusercontent.com/alexanderbacca/Exercises/main';
    var IMAGES = [
        'Squats.webp',
        'Push-ups.webp',
        'Mountain%20climber.webp',
        'Reverse%20Dips.webp',
        'High%20Knees.webp',
        'Planks.webp',
        'Crunches.webp',
        'Bicycle%20Crunches.webp',
        'Elevated%20Leg%20Push-ups.webp'
    ];

    // Keep the photos in a long-lived cache so they are instant on future visits
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register('./sw.js').catch(function () {});
        });
    }

    // Download upcoming exercise photos in the background while you use the app
    function preloadNext(queue) {
        var name = queue.shift();
        if (!name) return;
        var img = new Image();
        img.onload = img.onerror = function () { preloadNext(queue); };
        img.src = IMAGE_BASE + '/' + name;
    }

    window.addEventListener('load', function () {
        setTimeout(function () {
            var queue = IMAGES.slice();
            preloadNext(queue);  // three photos at a time, in workout order
            preloadNext(queue);
            preloadNext(queue);
        }, 500);
    });
})();
    </script>
</body>
</html>
